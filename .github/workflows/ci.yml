name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: build / vet / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: katrix
          POSTGRES_PASSWORD: katrix
          POSTGRES_DB: katrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katrix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CGO_ENABLED: 0
      KATRIX_TEST_DSN: postgres://katrix:katrix@localhost:5432/katrix_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: go build (0cgo)
        run: CGO_ENABLED=0 go build ./...
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './tmp/*'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      # The race detector requires cgo; the 0cgo hard constraint applies to the
      # shipped binary (built above), not the test suite.
      - name: go test (race)
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  web:
    name: build web (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm -C web install --no-frozen-lockfile
      - name: typecheck + build
        run: pnpm -C web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: internal/webui/dist
