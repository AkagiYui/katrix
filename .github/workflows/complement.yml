name: complement

on:
  push:
    branches: [master, feat/next-phase]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complement:
    name: Complement (black-box)
    runs-on: ubuntu-latest
    # Complement needs Docker-in-Docker to spin up homeserver containers.
    services:
      docker:
        image: docker:dind
        options: --privileged
    env:
      COMPLEMENT_BASE_IMAGE: ghcr.io/akagiyui/katrix:complement
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: build complement image
        run: |
          docker build -f Containerfile.complement -t "$COMPLEMENT_BASE_IMAGE" .
      - name: checkout complement
        uses: actions/checkout@v7
        with:
          repository: matrix-org/complement
          path: complement
      - name: run complement (core + msc suites)
        env:
          COMPLEMENT_SHARE_ENV_PREFIX: PASS_
          PASS_SERVER_NAME: complement-test
        run: |
          cd complement
          # Run the core CS API + federation + selected MSC suites. The full
          # Complement suite is large; we enable the suites Katrix targets for
          # spec-compliance acceptance and report pass/fail counts.
          go test -v -tags="msc2836 msc2946 msc3030 msc3874 msc3890 msisns" ./tests/... 2>&1 \
            | tee /tmp/complement.log || true
      - name: summarise results
        if: always()
        run: |
          echo "## Complement results" >> "$GITHUB_STEP_SUMMARY"
          passed=$(grep -c -- '--- PASS:' /tmp/complement.log || true)
          failed=$(grep -c -- '--- FAIL:' /tmp/complement.log || true)
          skipped=$(grep -c -- '--- SKIP:' /tmp/complement.log || true)
          echo "| Suite | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| PASS | ${passed:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| FAIL | ${failed:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SKIP | ${skipped:-0} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pass rate: $passed / $((passed + failed + skipped))" >> "$GITHUB_STEP_SUMMARY"
      - name: upload complement log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complement-log
          path: /tmp/complement.log