name: complement

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complement:
    name: Complement (black-box)
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        options: --privileged
    env:
      COMPLEMENT_BASE_IMAGE: ghcr.io/akagiyui/katrix:complement
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - run: docker build -f Containerfile.complement -t "$COMPLEMENT_BASE_IMAGE" .
      - uses: actions/checkout@v7
        with:
          repository: matrix-org/complement
          path: complement
      - name: run complement
        env:
          COMPLEMENT_SHARE_ENV_PREFIX: PASS_
          PASS_SERVER_NAME: complement-test
        run: |
          cd complement
          go test -v -tags="msc2836 msc2946 msc3030 msc3874 msc3890 msisns" ./tests/... 2>&1 \
            | tee /tmp/complement.log || true
      - name: summary
        if: always()
        run: |
          p=$(grep -c -- '--- PASS:' /tmp/complement.log || true)
          f=$(grep -c -- '--- FAIL:' /tmp/complement.log || true)
          s=$(grep -c -- '--- SKIP:' /tmp/complement.log || true)
          echo "## Complement results" >> "$GITHUB_STEP_SUMMARY"
          echo "| PASS | FAIL | SKIP | Pass rate |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ${p:-0} | ${f:-0} | ${s:-0} | ${p:-0} / $((p + f + s)) |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complement-log
          path: /tmp/complement.log
