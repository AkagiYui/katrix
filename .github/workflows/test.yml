name: test

# Black-box / integration test suite, modelled on Dendrite's "single workflow,
# parallel jobs + alls-green gate" layout. Complement runs as two parallel
# matrix jobs (root package vs MSC suites), SyTest as two file-group jobs
# (federation vs everything else — 50federation's files share the mock
# federation server, so they stay together), and Complement Crypto as two
# client-direction jobs (jr / rj) — all so no single `go test` package binary
# or sytest process can hit a per-package timeout and truncate the run. All
# jobs are informational baselines (continue-on-error) while katrix is still
# early — they establish a progress baseline rather than blocking PRs. The
# integration-done gate is therefore effectively a no-op today. Run steps
# surface failures honestly (set -o pipefail, no `|| true` swallowing), so a
# failing suite shows a red step with the real exit code; to turn a job into a
# hard gate, drop its `continue-on-error: true` once its pass rate is high
# enough.
#
# Each job's summary step renders a per-test report (PASS/FAIL/SKIP per suite,
# plus expected-vs-actual for every failing test) via cmd/testreport, fed by
# the raw logs uploaded as artifacts.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Complement runs as two parallel jobs so no single `go test` package binary
  # can eat the whole suite's budget: the root ./tests package (the largest)
  # has already hit the go test default 10-minute per-package timeout under
  # load, truncating the run and silently dropping every not-yet-started test
  # (a misleadingly low pass count). Splitting gives each group its own runner
  # and its own log/artifact, and `-timeout 30m` removes the truncation risk
  # entirely.
  complement:
    name: Complement (${{ matrix.group }})
    runs-on: ubuntu-latest
    continue-on-error: true # informational baseline; katrix is early
    strategy:
      fail-fast: false
      matrix:
        group: [core, msc-suites]
    env:
      COMPLEMENT_BASE_IMAGE: ghcr.io/akagiyui/katrix:complement
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - run: docker build -f Containerfile.complement -t "$COMPLEMENT_BASE_IMAGE" .
      - uses: actions/checkout@v7
        with:
          repository: matrix-org/complement
          path: complement
      # Vendor an hs_katrix.go so Complement knows which HS is under test
      # (via the katrix_blacklist build tag). Stops the "Complement doesn't
      # know which HS is running" warnings from runtime.SkipIf. Lives under
      # .complement-runtime/ (not complement/, which is overwritten by the
      # complement checkout above).
      - name: register katrix with complement
        run: cp .complement-runtime/hs_katrix.go complement/runtime/hs_katrix.go
      - name: run complement
        env:
          COMPLEMENT_SHARE_ENV_PREFIX: PASS_
          # Optional: comma-separated MSC suite numbers to skip, e.g. "3902"
          # when a suite is known-broken and should not pollute the baseline.
          COMPLEMENT_EXCLUDE: ''
        shell: bash
        run: |
          set -o pipefail
          cd complement
          # Only the katrix_blacklist tag matters here: it lets
          # runtime.SkipIf() identify katrix as the HS under test (see
          # .complement-runtime/hs_katrix.go). The mscXXXX / msisns tags are
          # dead weight — no complement build constraint ever referenced them,
          # and the msc2946/msc3030 suites have since been deleted upstream.
          # ./tests/... runs every package regardless, so all current MSC
          # suites (msc2836 ... msc4306) are exercised automatically.
          # Resolve the package list explicitly because ./tests/... offers no
          # way to skip a single suite; COMPLEMENT_EXCLUDE (comma-separated
          # suite numbers) filters the msc*/ directories out of the run.
          pkgs=$(find ./tests -mindepth 1 -maxdepth 1 -type d | sort)
          if [ -n "${COMPLEMENT_EXCLUDE}" ]; then
            for suite in $(echo "${COMPLEMENT_EXCLUDE}" | tr ',' ' '); do
              pkgs=$(printf '%s\n' "$pkgs" | grep -vE "/msc${suite}$") || true
            done
          fi
          if [ "${{ matrix.group }}" = "core" ]; then
            pkgset=./tests
          else
            pkgset=${pkgs}
          fi
          # shellcheck disable=SC2086  # pkgset is word-split on purpose
          go test -json -timeout 30m -tags="katrix_blacklist" $pkgset 2>&1 \
            | tee /tmp/complement.log
      - name: summary
        if: always()
        # testreport renders the per-test breakdown (expected vs actual) from
        # the go test -json log; works on a missing/empty log too.
        run: |
          go run ./cmd/testreport complement /tmp/complement.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: complement-log-${{ matrix.group }}
          path: /tmp/complement.log

  sytest:
    name: SyTest (${{ matrix.group }})
    runs-on: ubuntu-latest
    continue-on-error: true # informational baseline; katrix is early
    strategy:
      fail-fast: false
      matrix:
        group: [core, federation]
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@v7
      # SyTest keeps per-homeserver logic in its own lib/scripts (not the HS
      # repo). Fetch it and graft katrix's homeserver module + runner on top.
      - name: checkout sytest
        uses: actions/checkout@v7
        with:
          repository: matrix-org/sytest
          ref: develop
          path: sytest-src
      - name: graft katrix sytest support
        run: |
          cp sytest/Katrix.pm sytest-src/lib/SyTest/Homeserver/Katrix.pm
          cp sytest/KatrixFactory.pm sytest-src/lib/SyTest/HomeserverFactory/Katrix.pm
          cp sytest/katrix_sytest.sh sytest-src/scripts/katrix_sytest.sh
          chmod +x sytest-src/scripts/katrix_sytest.sh
          chmod +x sytest/are-we-synapse-yet.py sytest/show-expected-fail-tests.sh
          # Harden the sytest federation mock: a conforming homeserver may send
          # transactions for rooms the mock never joined/created, and sytest's
          # "Unknown room" warning derefs the room_id as a symbol name (strict
          # refs crash) — see sytest/patches/federation-server-unknown-room.patch.
          patch -p1 -d sytest-src < sytest/patches/federation-server-unknown-room.patch
      # The summary step below renders the TAP report with the Go tool.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: build sytest-katrix image
        run: docker build -f Containerfile.sytest -t sytest-katrix .
      - name: run sytest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p sytest-logs
          # Split the suite by file groups so the two halves run on parallel
          # runners. run-tests.pl takes a file whitelist (only those files'
          # tests are collected), but every file is still loaded, so fixture
          # definitions (TEST_SERVER_INFO, INBOUND_SERVER, local_user_fixture,
          # ...) are always available. The federation group keeps the whole
          # tests/50federation directory together because its files share the
          # INBOUND_SERVER/OUTBOUND_CLIENT fixtures from 00prepare.pl; the core
          # group gets everything else. Paths are rewritten to the in-container
          # /sytest mount.
          if [ "${{ matrix.group }}" = "federation" ]; then
            files=$(find sytest-src/tests/50federation -name '*.pl' | sort)
          else
            files=$(find sytest-src/tests -name '*.pl' -not -path '*/50federation/*' | sort)
          fi
          # run-tests.pl matches its file whitelist against walkdir's paths,
          # which are relative to the CWD (the container's /sytest). Strip the
          # host checkout prefix to yield "tests/...".
          files=$(printf '%s\n' "$files" | sed 's|^sytest-src/||')
          # shellcheck disable=SC2086  # files is word-split on purpose
          docker run --rm \
            -v "$PWD/sytest-src:/sytest" \
            -v "$PWD:/src" \
            -v "$PWD/sytest-logs:/logs" \
            -e POSTGRES=1 \
            -e SYTEST_DEFAULT_BRANCH=develop \
            sytest-katrix $files 2>&1 | tee /tmp/sytest.log
      - name: summary
        if: always()
        run: |
          tap="$PWD/sytest-logs/results.tap"
          go run ./cmd/testreport sytest "$tap" >> "$GITHUB_STEP_SUMMARY"
          # Append the "Are We Synapse Yet?" feature-area parity summary that
          # katrix_sytest.sh prints at the end of the container run. Rows come
          # out of the script as "Name: NN% (x/y tests)", so split on the first
          # colon to fill the "area" and "pass rate" columns — one-column rows
          # would otherwise render with an empty pass-rate column.
          if awk '/^Are We Synapse Yet\?/{p=1} p && /^[A-Za-z -]+ APIs:/' /tmp/sytest.log | grep -q .; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Are We Synapse Yet? (feature areas)" >> "$GITHUB_STEP_SUMMARY"
            # The area→pass-rate table comes from are-we-synapse-yet.list, a
            # static snapshot vendored from dendrite (last updated upstream
            # 2023-09); it groups sytest names into feature areas. The
            # "Unknown API" row under Non-Spec APIs is the drift indicator:
            # new sytest cases not in the list land there, so watch that row
            # grow rather than chasing the table for freshness.
            echo "| area | pass rate |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            awk '/^Are We Synapse Yet\?/{p=1} p && /^[A-Za-z -]+ APIs:/{
              match($0, /^[A-Za-z -]+ APIs:/)
              name = substr($0, 1, RLENGTH - 1)
              rest = substr($0, RLENGTH + 1)
              gsub(/^[ ]+/, "", rest)
              print "| " name " | " rest " |"
            }' /tmp/sytest.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sytest-logs-${{ matrix.group }}
          path: |
            sytest-logs/
            /tmp/sytest.log

  complement-crypto:
    name: Complement Crypto (${{ matrix.axis }})
    # Complement launches headless Chrome (chromedp) for the JS SDK axis;
    # Ubuntu 24.04+ AppArmor blocks unprivileged user namespaces, so Chrome
    # dies with "No usable sandbox!". Upstream complement-crypto pins 22.04
    # for the same reason. Revisit when GitHub retires the 22.04 image (then
    # patch chrome.go to add --no-sandbox instead).
    runs-on: ubuntu-22.04
    continue-on-error: true # informational baseline; crypto impl is incomplete
    strategy:
      fail-fast: false
      matrix:
        # Each matrix row runs the whole crypto suite but with a single
        # client-direction matrix (COMPLEMENT_CRYPTO_TEST_CLIENT_MATRIX): jr =
        # js client on hs1 + rust client on hs2, rj = the reverse. The two
        # axes exercise separate code paths (the js-sdk RPC and the rust-sdk
        # RPC), so splitting halves wall-clock on parallel runners; the build
        # of both SDKs is shared per row.
        axis: [jr, rj]
    env:
      # complement-crypto expects the homeserver image at this ref.
      COMPLEMENT_BASE_IMAGE: homeserver
      COMPLEMENT_ENABLE_DIRTY_RUNS: '1'
      COMPLEMENT_SHARE_ENV_PREFIX: PASS_
      COMPLEMENT_CRYPTO_TEST_CLIENT_MATRIX: ${{ matrix.axis }}
      COMPLEMENT_CRYPTO_MITMDUMP: mitm.dump
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      # Build the katrix complement base image and tag it as `homeserver:latest`
      # (the ref COMPLEMENT_BASE_IMAGE points at).
      - name: build katrix complement image
        run: docker build -f Containerfile.complement -t homeserver:latest .

      # The complement-crypto checkout below overwrites the vendored
      # complement-crypto/ directory of this repository, which is where
      # katrix's patches live. Stash them outside the workspace first so the
      # apply step below can still find them.
      - name: stash katrix complement-crypto patches
        run: |
          mkdir -p "$RUNNER_TEMP/katrix-patches"
          cp complement-crypto/patches/*.patch "$RUNNER_TEMP/katrix-patches/"
          ls "$RUNNER_TEMP/katrix-patches"

      - name: checkout complement-crypto
        uses: actions/checkout@v7
        with:
          repository: matrix-org/complement-crypto
          ref: main
          path: complement-crypto
      - name: checkout matrix-rust-sdk
        uses: actions/checkout@v7
        with:
          repository: matrix-org/matrix-rust-sdk
          ref: main
          path: complement-crypto/rust-sdk
      # complement-crypto tracks matrix-rust-sdk main, which has moved ahead of
      # complement-crypto's wrapper code. Apply katrix's local patches before
      # building (see complement-crypto/patches/). A patch that no longer
      # applies cleanly fails the build loudly rather than silently shipping
      # unpatched code.
      - name: apply complement-crypto patches
        run: |
          for p in "$RUNNER_TEMP"/katrix-patches/*.patch; do
            echo "applying $p"
            patch -p1 -d complement-crypto < "$p"
          done

      # --- toolchains for the two SDK client axes (jr,rj) ---
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: yarn
          cache-dependency-path: complement-crypto/internal/api/js/js-sdk/yarn.lock
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: complement-crypto/rust-sdk
          # matrix-rust-sdk main's Cargo.lock drifts (ruma fork patch unused),
          # so cached build artifacts go stale: on a fresh runner image cargo
          # skips rebuilding them (fingerprint mismatch) and dependents fail
          # with E0463 "can't find crate for X". Only cache the registry
          # (sources), never the compiled target, so every build is coherent.
          cache-targets: false

      # complement-crypto vendorises the JS SDK into its own tree via yarn.
      # matrix-js-sdk's active branch is "develop" (it has no "main"), which is
      # what complement-crypto's resolve_branch.sh resolves to on its main
      # branch.
      - name: build JS SDK
        run: |
          cd complement-crypto
          ./rebuild_js_sdk.sh "matrix-js-sdk@https://github.com/matrix-org/matrix-js-sdk#develop"

      # Build the matrix-sdk-ffi crate and generate the Go bindings. Upstream
      # moved the one-off shell scripts into a `just` recipe set (justfile), so
      # invoke those: `just install-uniffi-bindgen` installs uniffi-bindgen-go
      # (cargo install, pinned UNIFFI_GO_VERSION) and `just rebuild-rust-sdk`
      # builds the crate and regenerates bindings.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: install uniffi-bindgen-go
        run: |
          cd complement-crypto
          just install-uniffi-bindgen
      - name: build Rust FFI bindings
        run: |
          cd complement-crypto
          just rebuild-rust-sdk ./rust-sdk
          echo "RUST_SDK_LIB=$GITHUB_WORKSPACE/complement-crypto/rust-sdk/target/debug" >> "$GITHUB_ENV"

      - name: build RPC client
        env:
          LIBRARY_PATH: ${{ env.RUST_SDK_LIB }}
          LD_LIBRARY_PATH: ${{ env.RUST_SDK_LIB }}
        run: |
          cd complement-crypto
          go build -tags='jssdk,rust' -o rpc ./cmd/rpc

      - name: run complement-crypto
        env:
          LIBRARY_PATH: ${{ env.RUST_SDK_LIB }}
          LD_LIBRARY_PATH: ${{ env.RUST_SDK_LIB }}
          COMPLEMENT_CRYPTO_RPC_BINARY: ${{ github.workspace }}/complement-crypto/rpc
        shell: bash
        run: |
          cd complement-crypto
          set -o pipefail
          go test -p 3 -v -json -tags='jssdk,rust' -count=1 -timeout 15m \
            ./tests ./tests/js ./tests/rust 2>&1 | tee /tmp/crypto.log
      - name: summary
        if: always()
        run: |
          go run ./cmd/testreport crypto /tmp/crypto.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: complement-crypto-log-${{ matrix.axis }}
          path: /tmp/crypto.log

  integration-done:
    name: integration tests done
    needs: [complement, sytest, complement-crypto]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}